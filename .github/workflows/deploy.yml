name: Deploy to InfinityFree

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy via FTP (sem vendor)
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          sudo apt-get install -y lftp
          printf '%s\n' "$DOTENV" > /tmp/env_tmp
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:chmod-default '';
            open ftp://${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}@${{ secrets.FTP_HOST }};
            cd /htdocs;
            put public/.htaccess.htdocs -o /htdocs/.htaccess;
            # Upload apenas arquivos do projeto (sem vendor/ nem node_modules/)
            mirror --reverse --no-perms --exclude-glob='vendor/*' --exclude-glob='node_modules/*' --exclude-glob='.git/*' --exclude-glob='storage/logs/*' --exclude-glob='storage/framework/cache/*' --exclude-glob='storage/framework/sessions/*' --exclude-glob='storage/framework/views/*' --exclude-glob='storage/framework/testing/*' --exclude-glob='public/*' --exclude-glob='wallet-mintme/*' --exclude-glob='*.zip' --exclude-glob='vendor_part_*' . /htdocs/;
            # Upload public/ (com assets compilados)
            mirror --reverse --no-perms public/ /htdocs/public/;
            # Upload .env
            put /tmp/env_tmp -o /htdocs/.env;
            quit
          "

      - name: Clear caches via browser
        run: |
          curl -s "http://filmes100ads.free.nf/server-reset.php?key=${{ secrets.DEPLOY_KEY }}&action=reset" --max-time 30 || true
