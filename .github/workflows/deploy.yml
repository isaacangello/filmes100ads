name: Deploy to InfinityFree

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare deployment files
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          printf '%s\n' "$DOTENV" > .env
          cp public/.htaccess.htdocs .htaccess

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /htdocs/
          local-dir: ./
          exclude: |
            **/.git/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/framework/testing/**
            **/wallet-mintme/**
            **/*.zip
            **/vendor_part_*
            **/.idea/**
            **/.junie/**
            **/.github/**
            **/tests/**
            **/.env.example
            **/.env.testing
            **/.env.ftp
            **/.env.native

      - name: Clear caches via browser
        run: |
          curl -s "http://filmes100ads.free.nf/server-reset.php?key=${{ secrets.DEPLOY_KEY }}&action=reset" --max-time 30 || true
